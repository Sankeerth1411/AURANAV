# AURANAV Configuration File
# Smart Glasses AI System for Visual Assistance

roboflow:
  workspace: "sankeerth-rajoli-sankeerth"
  project: "merge_final-iixxm-huf72"
  version: 2
  format: "yolov8"
  expected_classes: 27

paths:
  raw_dataset: "data/raw"
  prepared_dataset: "data/prepared"
  artifacts: "artifacts"
  weights: "artifacts/weights"
  logs: "artifacts/logs"
  test_results: "artifacts/test_results"

model:
  architecture: "yolov8n"
  pretrained: true
  input_size: 640

training:
  epochs: 30
  batch_size: 4
  patience: 10
  device: "auto"
  workers: 2
  save_period: 10
  amp: true
  augmentation:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 0.0
    translate: 0.1
    scale: 0.5
    shear: 0.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.0

inference:
  confidence_threshold: 0.25
  iou_threshold: 0.45
  max_detections: 100
  device: "cpu"
  half_precision: false

camera:
  source: 0
  width: 640
  height: 480
  fps: 30
  buffer_size: 1

tracking:
  enabled: true
  max_age: 8
  min_hits: 2
  iou_threshold: 0.3

hazard:
  class_severity:
    pothole: 90
    "bad road": 85
    vehicle: 80
    car: 80
    truck: 80
    bus: 80
    motorcycle: 75
    bicycle: 70
    scooter: 70
    person: 70
    dog: 65
    "down stairs": 95
    "up stairs": 80
    stairs: 80
    pole: 75
    tree: 70
    "fence barrier": 70
    bollard: 75
    "fire hydrant": 60
    "parking meter": 50
    "traffic light": 40
    "stop sign": 40
    "traffic cone": 70
    crosswalk: 30
    bench: 50
    "trash bin": 60
    bird: 20
    cat: 40
  position:
    center_zone_width: 0.4
    center_multiplier: 1.5
    side_multiplier: 0.8
  size:
    small_threshold: 0.05
    medium_threshold: 0.15
    large_threshold: 0.30
    small_multiplier: 0.5
    medium_multiplier: 1.0
    large_multiplier: 1.5
    xlarge_multiplier: 2.0
  movement:
    approaching_multiplier: 1.8
    receding_multiplier: 0.6
    stationary_multiplier: 1.0
    velocity_threshold: 0.02
  alert:
    critical_threshold: 70
    warning_threshold: 50
    info_threshold: 30

audio:
  enabled: true
  engine: "pyttsx3"
  rate: 180
  volume: 1.0
  cooldown:
    same_object: 3.0
    same_class: 2.0
    any_alert: 0.7
  templates:
    critical: "{class_name} ahead"
    warning: "{class_name} on your {direction}"
    info: "{class_name} nearby"
  directions:
    left_threshold: 0.33
    right_threshold: 0.67
    left_label: "left"
    center_label: "ahead"
    right_label: "right"

validation:
  min_images_per_split:
    train: 100
    valid: 20
    test: 20
  max_annotation_errors: 100
  required_files:
    - "data.yaml"
    - "train/images"
    - "train/labels"
    - "valid/images"
    - "valid/labels"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "artifacts/logs/auranav.log"
  console: true

raspberry_pi:
  enabled: false
  model_path: "artifacts/weights/auranav_best_int8.tflite"
  camera_module: "picamera2"
  resolution: [640, 480]
  framerate: 30
  inference_threads: 4
